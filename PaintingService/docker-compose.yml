version: '3.8'

services:
  # Twój mikroserwis z Vision Transformerem
  vision-service:
    build: .
    container_name: vision_service_container
    ports:
      - "8087:8087"
    deploy:
      resources:
        limits:
          memory: 4G # Możesz ograniczyć RAM, żeby sprawdzić kiedy serwis padnie (do testów w pracy)

  # cAdvisor - patrzy na zużycie RAM/CPU przez kontenery
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  # Prometheus - zbiera dane z cAdvisora
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # Grafana - rysuje wykresy
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus